name: CI

# Formatting, lints (warnings fail: the code is clippy-clean) and tests on
# every push to master and every pull request, plus a build with the oldest
# Rust that Cargo.toml promises (rust-version).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --no-deps: sanitty only, not the karet-lsp fork (upstream's code, as published).
      - run: cargo clippy --all-targets --locked --no-deps -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
