[package]
name = "sanitty"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A little sanity for your tty: a non-modal IDE for the terminal"
license = "MIT"
authors = ["Robin van der Noord <robinvandernoord@gmail.com>"]
repository = "https://github.com/robinvandernoord/sanitty"
readme = "README.md"
keywords = ["ide", "editor", "terminal", "tui", "lsp"]
categories = ["command-line-utilities", "text-editors", "development-tools"]
# CI workflows are for the repository, not the crate.
exclude = [".github/"]

[[bin]]
name = "sanitty"
path = "src/main.rs"

[dependencies]
karet-core = "0.8.0"
karet-text = "0.8.0"
karet-editor = "0.8.0"
karet-theme = { version = "0.8.0", features = ["view"] }
karet-syntax = { version = "0.8.0", features = [
    "lang-python", "lang-rust", "lang-typescript", "lang-javascript", "lang-json",
    "lang-toml", "lang-yaml", "lang-markdown", "lang-sql", "lang-html", "lang-css",
    "lang-bash", "lang-containerfile", "lang-scss", "lang-sass", "lang-less",
] }
# karet-lsp 0.8.0 with two fixes, published as its own crate so sanitty can be
# installed from crates.io (see crates/sanitty-karet-lsp/SANITTY-PATCH.md).
karet-lsp = { package = "sanitty-karet-lsp", version = "0.8.0", path = "crates/sanitty-karet-lsp" }
karet-search = "0.8.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
ignore = "0.4"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same versions karet-treesitter builds, used directly for TypeScript
# highlighting with the JavaScript and TypeScript queries combined.
tree-sitter = "0.26.13"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
streaming-iterator = "0.1.9"
toml = "0.9"
anyhow = "1"
dirs = "6"
karet-diff = "0.8.0"
# Databases for the Database view. No compile-time macros: queries are typed
# at runtime. rustls with the system's roots, for servers that require TLS.
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio", "postgres", "mysql", "sqlite-bundled", "tls-rustls-ring-native-roots",
] }
futures-util = { version = "0.3", default-features = false }
# The Terminal view: the shell in a pseudo-terminal, its screen kept by vt100
# (the version tui-term draws) and drawn by tui-term.
portable-pty = "0.9"
vt100 = "0.16"
tui-term = "0.3.4"

# One static binary per architecture is shipped as is: stripped, and linked
# across crates for size.
[profile.release]
strip = true
lto = "thin"

# `cargo binstall sanitty` downloads the release's archive instead of
# building (named as in cargo-plane). The binaries are static (musl), so they
# serve the usual gnu targets too.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-unknown-linux-musl-v{ version }.tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-aarch64-unknown-linux-musl-v{ version }.tgz"

# The .deb for the apt repository (cargo deb --target <musl target>
# --no-build): one static binary, so no library dependencies.
[package.metadata.deb]
section = "editors"
priority = "optional"
depends = ""
recommends = "git, ca-certificates"
suggests = "docker-compose-plugin"
extended-description = """\
A non-modal IDE that runs entirely in the terminal and over SSH: \
language servers (definition, usages, rename, problems, completion), \
a Review view for diffs, commits and pull requests with comments, \
a Database view for PostgreSQL, MySQL/MariaDB and SQLite, and \
multi-caret editing. Most shortcuts use Alt, so terminals built into \
other apps can keep their Ctrl keys."""
assets = [
    ["target/release/sanitty", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sanitty/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/sanitty/CHANGELOG.md", "644"],
]

# The karet-lsp fork is a member, published with sanitty (`cargo publish
# --workspace`); commands run in the root act on sanitty alone.
[workspace]
members = ["crates/*"]

[lints.clippy]
# Hard rules: no panicking shortcuts in the IDE.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Identifiers must be at least 3 characters (see clippy.toml for the allowlist).
min_ident_chars = "warn"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
